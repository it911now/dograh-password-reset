<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your {{ product_name }} password was changed</title>
</head>
<body style="margin:0;padding:0;background:#f4f5f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1d1f23;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5f7;padding:24px 12px;">
<tr><td align="center">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border-radius:8px;padding:32px;">
<tr><td>
<p style="margin:0 0 16px;font-size:16px;line-height:1.5;">Hello,</p>
<p style="margin:0 0 16px;font-size:16px;line-height:1.5;">The password for your {{ product_name }} account was just changed.</p>
<p style="margin:0 0 16px;font-size:14px;line-height:1.5;color:#4a4f57;">If you made this change, no action is needed.</p>
<p style="margin:0 0 16px;font-size:14px;line-height:1.5;color:#4a4f57;">If you did not make this change, contact your administrator right away.</p>
{% if support_text %}
<p style="margin:24px 0 0;font-size:13px;line-height:1.5;color:#6b717a;">{{ support_text }}</p>
{% endif %}
</td></tr>
</table>
</td></tr>
</table>
</body>
</html>
