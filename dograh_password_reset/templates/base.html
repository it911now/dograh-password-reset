<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>{% block title %}{% endblock %} - {{ product_name }}</title>
<style>
:root { color-scheme: light dark; --bg:#f4f5f7; --card:#fff; --fg:#1d1f23; --muted:#5b616b; --line:#cfd3d9; --accent:#2457d6; --accent-fg:#fff; --err:#b3261e; }
@media (prefers-color-scheme: dark) { :root { --bg:#15171a; --card:#1e2125; --fg:#eceef1; --muted:#a0a6af; --line:#3a3f46; --accent:#6b94ff; --accent-fg:#101318; --err:#ff8a80; } }
* { box-sizing: border-box; }
body { margin:0; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px 16px; background:var(--bg); color:var(--fg); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; line-height:1.5; }
.card { width:100%; max-width:420px; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:28px; }
h1 { margin:0 0 12px; font-size:1.3rem; }
p { margin:0 0 14px; }
label { display:block; margin:0 0 4px; font-size:.9rem; font-weight:600; }
input[type=email], input[type=password] { width:100%; padding:10px; margin:0 0 14px; border:1px solid var(--line); border-radius:6px; background:transparent; color:inherit; font:inherit; }
button { width:100%; padding:11px; border:0; border-radius:6px; background:var(--accent); color:var(--accent-fg); font:inherit; font-weight:600; cursor:pointer; }
a { color:var(--accent); }
.hint, .support { color:var(--muted); font-size:.85rem; }
.support { max-width:420px; margin:16px 0 0; text-align:center; }
.errors { margin:0 0 14px; padding:10px 14px 10px 30px; border:1px solid var(--err); border-radius:6px; color:var(--err); }
</style>
</head>
<body>
<main class="card">
{% block content %}{% endblock %}
</main>
{% if support_text %}<p class="support">{{ support_text }}</p>{% endif %}
</body>
</html>
