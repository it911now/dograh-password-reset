{% extends "base.html" %}
{% block title %}Forgot password{% endblock %}
{% block content %}
<h1>Forgot your password?</h1>
<p>Enter the email address of your {{ product_name }} account and we will send you a link to choose a new one.</p>
<form method="post" action="{{ base_path }}/request">
<input type="hidden" name="csrf" value="{{ csrf }}">
<label for="email">Email address</label>
<input id="email" name="email" type="email" autocomplete="email" required autofocus>
<button type="submit">Send reset link</button>
</form>
<p class="hint" style="margin-top:16px"><a href="{{ login_url }}">Back to sign in</a></p>
{% endblock %}
