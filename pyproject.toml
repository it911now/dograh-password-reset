[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dograh-password-reset"
version = "0.1.0"
description = "Forgot-password add-on for self-hosted Dograh (local auth)"
license = "BSD-2-Clause"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "bcrypt>=4.2",
    "httpx>=0.27",
    "jinja2>=3.1",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
]

[project.scripts]
dograh-reset = "dograh_password_reset.cli:main"

[project.optional-dependencies]
test = [
    "pytest>=8",
    "aiosmtpd>=1.4",
]

[tool.setuptools]
packages = ["dograh_password_reset"]

[tool.setuptools.package-data]
dograh_password_reset = ["templates/*", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
