# Optional add-on for Dograh: a "Forgot password?" self-service reset (local login only).
#
# Setup (see INSTALL.md, step 2):
#   1. Copy the package folder next to Dograh's docker-compose.yaml, named "password-reset".
#   2. Copy this file next to it, named docker-compose.password-reset.yaml.
#   3. Edit the values marked EDIT below.
#   4. Start with both files:
#        docker compose -f docker-compose.yaml -f docker-compose.password-reset.yaml up -d --build
#
# The service names api, ui and postgres must match your Dograh compose file.
# Check them with: docker compose config --services

services:
  password-reset:
    build:
      context: ./password-reset
      target: base               # the runtime image (the Dockerfile's default stage)
    image: dograh-password-reset:0.1.0
    restart: unless-stopped
    depends_on:
      - api
      - postgres
    environment:
      DATABASE_URL_FILE: /run/secrets/db_url
      DOGRAH_API_URL: http://api:8000                 # internal URL of Dograh's API (service name api)
      PUBLIC_BASE_URL: https://dograh.example.com     # EDIT: the public address users open (https)
      BASE_PATH: /password-reset
      DOGRAH_LOGIN_PATH: /auth/login                  # EDIT if your login page is elsewhere
      RESET_TOKEN_TTL_MINUTES: "30"

      MAIL_TRANSPORT: smtp                            # smtp or webhook (INSTALL.md, step 3)
      SMTP_HOST: smtp.example.com                     # EDIT
      SMTP_PORT: "587"
      SMTP_STARTTLS: "true"
      SMTP_USERNAME: reset-sender@example.com         # EDIT
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password  # a relay that needs no login: delete this line and the smtp_password secret below
      MAIL_FROM: "Dograh <reset-sender@example.com>"  # EDIT

      PRODUCT_NAME: Dograh
      SUPPORT_TEXT: ""                                # optional line added to the emails and pages

      # Only with Cloudflare Tunnel, and only when the add-on is reachable solely through it (step 4).
      TRUST_CLOUDFLARE: "false"
      # Only behind your own reverse proxy (step 4): the proxy's address range, e.g. the Docker network.
      TRUSTED_PROXIES: ""
      # DB_POOL_SIZE: "4"   # most database connections in use at once; keep it below the role's CONNECTION LIMIT (grants.sql)
    secrets:
      - db_url
      - smtp_password
    ports:
      # Loopback only. The tunnel's /password-reset/ rule points here (INSTALL.md, step 4).
      - "127.0.0.1:8081:8080"
    # No healthcheck here: the image's own (Dockerfile) follows BASE_PATH.

  # Optional nginx front (INSTALL.md, step 5). It adds the "Forgot password?" link to Dograh's login page.
  # Skip this service and the front volumes if you do not want the link.
  password-reset-front:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - ui
      - password-reset
    volumes:
      - ./password-reset/front/defaults.envsh:/docker-entrypoint.d/16-defaults.envsh:ro
      - ./password-reset/front/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      # Loopback only. The tunnel's catch-all rule (or your reverse proxy) points here.
      - "127.0.0.1:8088:80"
    healthcheck:
      # Answered by nginx itself, so it does not depend on Dograh or the add-on.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/__front_health"]
      interval: 30s
      timeout: 5s
      retries: 3

secrets:
  # Files on the host. Only the password-reset service reads them.
  # chmod 700 the secrets folder and 644 the files: the container runs as a non-root user and must be able to read them.
  db_url:
    file: ./secrets/password-reset-db-url         # postgresql://dograh_password_reset:PASSWORD@postgres:5432/postgres  (the database name: "postgres" in stock Dograh)
  smtp_password:
    file: ./secrets/password-reset-smtp-password  # the SMTP password, nothing else
