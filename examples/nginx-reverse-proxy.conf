# Example host nginx in front of the password-reset front, without Cloudflare (INSTALL.md, step 4).
# Put this in /etc/nginx/conf.d/ (http context). Replace dograh.example.com and the certificate paths.

map $http_upgrade $dpr_connection_upgrade {
    default upgrade;
    ""      close;
}

# Reset links carry a single-use token in ?token=. Keep those requests out of the access log.
map $request_uri $dpr_loggable {
    ~*token=  0;
    default   1;
}

server {
    listen 443 ssl;
    http2 on;
    server_name dograh.example.com;

    ssl_certificate     /etc/letsencrypt/live/dograh.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dograh.example.com/privkey.pem;

    access_log /var/log/nginx/dograh-access.log combined if=$dpr_loggable;
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $dpr_connection_upgrade;
        proxy_read_timeout 3600s;
    }
}

server {
    listen 80;
    server_name dograh.example.com;
    return 301 https://$host$request_uri;
}
