# Throwaway test stack for the password-reset add-on. Run via ../run-tests.sh.
# Uses its own compose project name (dpr-test) so it never touches the live dograh stack.
services:
  pg:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test-only-password
      POSTGRES_DB: dograh_test
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dograh_test"]
      interval: 2s
      timeout: 3s
      retries: 30

  tests:
    build:
      context: ..
      dockerfile: Dockerfile
      target: test
    depends_on:
      pg:
        condition: service_healthy
    environment:
      TEST_DATABASE_URL: postgresql://postgres:test-only-password@pg:5432/dograh_test
